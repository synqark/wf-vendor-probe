[package]
name = "wf-vendor-probe"
version = "0.1.0"
edition = "2021"
description = "Read-only memory probe for locating JSON API responses inside the Warframe client"

[dependencies]
memchr = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
] }

[profile.release]
opt-level = 3
